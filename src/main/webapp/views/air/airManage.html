/* ----------------------------------- */
#searchBox *{
	height: 100%
}

.file-tree {
    width: 300px;
    border-radius: 5px;
    padding: 10px;
    background-color: #fff;
    font-size: 12px;
    margin: 5px;
}

.listSpan {
    cursor: pointer;
    user-select: none; /* Prevent text selection */
    display: block; /* Block level element to make it span the full width */
    margin-bottom: 5px; /* Add some space below the caret */
    font-weight: bold; /* Make the text bold */
}

.listSpan::before {
    content: "";
    display: inline-block;
    width: 16px;  /* 이미지의 너비 */
    height: 16px; /* 이미지의 높이 */
    background-image: url('../icon/folder-close.png'); /* 이미지를 삽입 */
    background-size: contain; /* 이미지 크기를 컨테이너에 맞춤 */
    background-repeat: no-repeat;
    margin-right: 5px;
    margin-bottom: 2px;
    vertical-align: middle; /* 텍스트와 이미지가 수직 정렬되도록 설정 */
    transition: background-image 0.5s ease;
}

.listSpan-down::before {
    background-image: url('../icon/folder-open.png'); /* 이미지를 삽입 */
}

.nested {
    display: none;
    padding-left: 20px; /* Indent the nested list */
}

.active {
    display: block;
    margin-left: 5px;
}

.file-item {
    display: flex;
    align-items: center;
    padding: 5px 0;
    border: 1px solid #e0e0e0;
    border-radius: 3px;
    margin: 2px 0;
    padding-left: 5px;
    cursor: pointer;
    font-weight: bold;
}

.file-item .icon {
    width: 16px;
    height: 16px;
    margin-right: 10px;
    background-size: contain;
    background-repeat: no-repeat;
}

#searchInput {
    border: 1px solid #ccc;
    border-radius: 5px;
    padding: 5px;
    font-size: 14px;
}


 @keyframes border-gradient-animation {
  0% {
    stroke-dashoffset: 380;
  }

  50% {
    stroke-dashoffset: 0;
  }

  100% {
   stroke-dashoffset: -380;
  }
} 

.animate-border {
  stroke-width: 8px;
  stroke-dasharray: 380;
  animation: border-gradient-animation 3s linear infinite;


}

.switch-container {
    position: relative;
    display: inline-block;
    width: 50px;
    height: 18px;
}
.switch-input {
    display: none;
}
.switch-label {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    background-color: #ccc;
    border-radius: 50px;
    cursor: pointer;
    transition: background-color 0.3s ease-in-out;
}
.switch-ball {
    position: absolute;
    top: 1px;
    left: 2px;
    width: 16px;
    height: 16px;
    background-color: white;
    border-radius: 50%;
    transition: transform 0.3s ease-in-out;
}

.switch-input:checked + .switch-label {
    background-color: #4caf50; /* 머티리얼 디자인의 녹색 */
}

.switch-input:checked + .switch-label .switch-ball {
    transform: translateX(25px);
}
