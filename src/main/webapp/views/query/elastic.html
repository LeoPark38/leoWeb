<section id="main-content" style="padding: 0 !important;">
	<div class="panel">
		<div class="panel-heading" style="display: flex;">
			<div id="elastic_sts" style="height: 16px; width: 16px; border-radius: 20px;"></div>
			<h3 class="panel-title">Elastic</h3>	
		</div>
		<div class="panel-body" style="padding: 0px 15px 0px 30px;">
			<div id="data_body" class="animate__animated animate__fadeIn">
		        <!-- 버튼 영역 -->
		        <div class="mb-3 d-flex flex-wrap gap-2">
		          <button ng-click="nodeStat()" class="btn btn-sm btn-primary">
		            <i class="fas fa-server"></i> node 상태
		          </button>
		          <button ng-click="nodeSearch()" class="btn btn-sm btn-primary">
		            <i class="fas fa-server"></i> node 서치
		          </button>
		          <button ng-click="clusetSet()" class="btn btn-sm btn-primary">
		            <i class="fas fa-server"></i> 클러스터 셋팅
		          </button>
		          <button ng-click="queryMange()" class="btn btn-sm btn-primary">
		            <i class="fas fa-server"></i> 저장된 쿼리
		          </button>
		        </div>
				<div class="querySearch" style="display: inline-block; width: 98%;">
					<div class="inline">
						<select id="method_list" class="width120" ng-model="method_type" style="margin-top: 4px;">
							<option value="GET">GET</option>
							<option value="POST">POST</option>
							<option value="PUT">PUT</option>
							<option value="Delete">Delete</option>
						</select>
					</div>
					<div class="inline">
						<select id="recent_query" class=""  style="margin-top: 4px;">
							<option value="">최근 검색 쿼리</option>
						</select>
					</div>
					<div class="floatR">
						<div ng-click="btnResetQuery()" class="btn btn-sm btn-primary width60">
							<i class="glyphicon glyphicon-repeat"></i>
						</div>
						<div ng-click="btnQuerySave()" id="btn_query_save" class="btn btn-sm btn-primary width80">
							<i class="fa fa-check"></i>저장
						</div>
						<div ng-click="btnSearch()" id="btn_search" class="btn btn-sm btn-primary width80">
							<i class="glyphicon glyphicon-search"></i> 검색
						</div>
					</div>
				</div>
				<div>
					<div id="editor1" style="display: inline-block; width: 49%;">
						<pre id="query_editor" style="width: 100%; line-height: 15px; height: 300px;"></pre>
					</div>
					<div id="editor2" style="display: inline-block; width: 49%;">
						<pre id="query_editor2" style="width: 100%; line-height: 15px;"></pre>
					</div>
				</div>
				<div id="queryModal" class="modal" style="display:none;">
					<div class="panel-heading">
						<h2 class="modal_title">쿼리 관리</h2>
					</div>
					<div class="" style="padding: 0px 10px 0px 10px;"> 
						<div style="height: auto;">
							<div style="padding-bottom: 5px">
								<table id="query_table" class="table table-striped table-bordered"
									cellspacing="0" width="100%">
									<thead>
										<tr class="bt1-ddd">
											<th>METHOD</th>
											<th>제목</th>
											<th>사용자 ID</th>
											<th>생성일</th>
											<th>-</th>
										</tr>
									</thead>
								</table>
							</div>
						</div>	
					</div>
					<div style="padding: 5px 5px 0px 0px;">
						<button type="submit" ng-click="queryModal_close()"
							class="btn btn-primary floatR width90">
							<i class="fa fa-times"></i>&nbsp;닫기
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</section>
<style>
#queryModal{
    display: none;
    width: 750px;
    height: 430px;
    top: 196px;
    border: solid;
    position: fixed;
    z-index: 1050;
    background-color: rgb(255, 255, 255);
}
#queryModal .panel-heading {
	border-top-left-radius: 0px !important;
    border-top-right-radius: 0px !important;
}
</style>
