<div id="wg_list_pop" class="panel panel-success reveal-modal">
	<div class="panel-heading">
		<h3 class="pop-title">위젯 관리</h3>
		<div class="actions pull-right"></div>
	</div>
	<div class="panel-body">
		<div class="form-horizontal">
			<div class="col-sm-12 text-left">
				<select id="tab_select" class="col-sm-3 form-control" style="width:200px;"></select>
				<button ng-click="tab_setup()" class="btn btn-sm btn-gr pull-right"><i class="fa fa-wrench"/>탭 관리</button>
			</div>
			<form class="form-horizontal ng-pristine ng-valid" role="form">
				<div class="col-sm-12">
					<table id="data_table" class="table table-striped table-bordered"  cellspacing="0" width="100%">
						<thead>
							<tr>
								<th id="check_box"></th>
								<th>제목</th>
								<th>위젯등록일</th>
								<th>-</th>
							</tr>
						</thead>			  
					</table>
				</div>
				<div class="col-sm-12 text-right" style="margin-top:5px;">
					<button ng-click="wg_close()" class="btn btn-bu"><i class="fa fa-times"/>닫기</button>
				</div>
			</form>
		</div>
	</div>
</div>

<div id="tab_setup_pop" class="panel panel-success reveal-modal">
	<div class="panel-heading">
		<h3 class="pop-title">탭 관리</h3>
		<div class="actions pull-right"></div>

				</div>
				<div class="col-sm-12">
					<table id="tab_data_table" class="table table-striped table-bordered"  cellspacing="0" width="100%">
						<thead>
							<tr>
								<th id="check_box2"><div class="checkbox3 checkbox-sm checkbox-inline checkbox-check checkbox-light" style="padding-top: 5px;"><input type="checkbox" id="all_chk_tab" class="input_check"><label for="all_chk_tab" style="padding: 3px 0 15px 40px;"> </label></th>

							</tr>
						</thead>			  
					</table>

				</div>
			</form>
		</div>
	</div>
